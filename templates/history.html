<!DOCTYPE html>
<html>
<head>
    <title>Patient History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1>Served Patients History</h1>

    <table class="table table-striped">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Status</th>
        </tr>

        {% for patient in patients %}
        <tr>
            <td>{{ patient[0] }}</td>
            <td>{{ patient[1] }}</td>
            <td>{{ patient[2] }}</td>
            <td>{{ patient[3] }}</td>
        </tr>
        {% endfor %}

    </table>

    <a href="/queue" class="btn btn-primary">
        Back to Queue
    </a>

</div>

</body>
</html>
