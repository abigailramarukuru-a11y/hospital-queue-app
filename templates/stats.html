<!DOCTYPE html>
<html>
<head>
    <title>Hospital Statistics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">
        Hospital Statistics Dashboard
    </h1>

    <div class="row">

        <div class="col-md-3">
            <div class="card text-white bg-primary mb-3">
                <div class="card-body">
                    <h5>Total Patients</h5>
                    <h2>{{ total }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-success mb-3">
                <div class="card-body">
                    <h5>General</h5>
                    <h2>{{ general }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-danger mb-3">
                <div class="card-body">
                    <h5>Emergency</h5>
                    <h2>{{ emergency }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-white bg-warning mb-3">
                <div class="card-body">
                    <h5>Dental</h5>
                    <h2>{{ dental }}</h2>
                </div>
            </div>
        </div>

    </div>

    <div class="row">

        <div class="col-md-3">
            <div class="card text-white bg-info mb-3">
                <div class="card-body">
                    <h5>Maternity</h5>
                    <h2>{{ maternity }}</h2>
                </div>
            </div>
        </div>

    </div>

    <a href="/queue" class="btn btn-primary">
        Back to Queue
    </a>

</div>

</body>
</html>
